name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  platform:
    name: platform (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ./mvnw verify runs unit tests, Testcontainers integration tests
      # (Docker is available on the runner) and the Spotless format check.
      - name: Build and test
        working-directory: platform
        run: ./mvnw --batch-mode verify

  agent:
    name: agent (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: agent
        run: pip install -e ".[dev]" ruff
      - name: Lint
        working-directory: agent
        run: ruff check src tests
      # Golden tests that need a live LLM skip automatically when GEMINI_API_KEY is absent.
      - name: Test
        working-directory: agent
        run: pytest -q

  simulator:
    name: simulator (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        working-directory: simulator
        run: pip install ruff && ruff check src

  ui:
    name: ui (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install and build
        working-directory: ui
        run: |
          npm ci
          npm run build
