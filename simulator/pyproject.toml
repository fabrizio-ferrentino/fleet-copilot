[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-simulator"
version = "0.1.0"
description = "Simulated IoT device fleet publishing telemetry over MQTT"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.0,<3"]

[project.scripts]
fleet-simulator = "simulator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
