spring:
  application:
    name: fleet-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:fleet}
    username: ${POSTGRES_USER:fleet}
    password: ${POSTGRES_PASSWORD:fleet}

server:
  port: ${PLATFORM_PORT:8080}

fleet:
  # A device is offline when not seen for longer than this (shorten it in demos/tests).
  offline-threshold: ${OFFLINE_THRESHOLD:10m}
  mqtt:
    uri: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
    client-id: fleet-platform-ingestion
    topic: fleet/+/telemetry
